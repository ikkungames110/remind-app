<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>リマインド</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <form id="form">
    <div class="row">
      <textarea id="text" placeholder="内容" rows="3" autofocus></textarea>
      <button type="button" id="mic" class="mic" aria-label="音声入力" hidden></button>
    </div>
    <div id="quick" class="quick">
      <button type="button" data-min="5">5分後</button>
      <button type="button" data-min="10">10分後</button>
      <button type="button" data-min="30">30分後</button>
      <button type="button" data-min="60">1時間後</button>
    </div>
    <div id="done" class="w" hidden>登録しました</div>
  </form>
</main>
<script src="/store.js"></script>
<script src="/voice.js"></script>
<script>
const text = document.getElementById('text');
const done = document.getElementById('done');
attachVoice(text, document.getElementById('mic'));
document.getElementById('form').onsubmit = (e) => e.preventDefault();
// ホーム画面のアプリとは保存場所が別になることがあるので、合言葉は URL から受け取る
const key = new URLSearchParams(location.hash.slice(1)).get('k');
if (key) saveToken(key);
if (!savedToken()) {
  done.textContent = 'アプリの「予約一覧」にある「クイック登録のURLをコピー」のURLから開いてください';
  done.hidden = false;
}
document.querySelectorAll('#quick button').forEach((b) => {
  b.onclick = async () => {
    if (!savedToken()) return;
    if (!text.value.trim()) return text.focus();
    // 内容はアプリを次に開いたときに端末へ移り、サーバーからは消える
    const res = await api('reminders', { method: 'POST', body: JSON.stringify({ text: text.value, after: b.dataset.min }) });
    if (!res.ok) return alert('登録できませんでした');
    text.value = '';
    done.textContent = `登録しました（${b.textContent}）`;
    done.hidden = false;
  };
});
</script>
</body>
</html>
