<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>リマインド</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <form id="form">
    <input id="text" placeholder="内容" autocomplete="off" autofocus>
    <div id="quick" class="quick">
      <button type="button" data-min="5">5分後</button>
      <button type="button" data-min="10">10分後</button>
      <button type="button" data-min="30">30分後</button>
      <button type="button" data-min="60">1時間後</button>
    </div>
    <div id="done" class="w" hidden>登録しました</div>
  </form>
</main>
<script>
const text = document.getElementById('text');
const done = document.getElementById('done');
document.getElementById('form').onsubmit = (e) => e.preventDefault();
document.querySelectorAll('#quick button').forEach((b) => {
  b.onclick = async () => {
    if (!text.value.trim()) return text.focus();
    const res = await fetch('/api/reminders', { method: 'POST', body: JSON.stringify({ text: text.value, after: b.dataset.min }) });
    if (!res.ok) return alert('登録できませんでした');
    text.value = '';
    done.textContent = `登録しました（${b.textContent}）`;
    done.hidden = false;
  };
});
</script>
</body>
</html>
