<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>リマインド</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <button id="notify" class="sub" hidden>通知を有効にする</button>

  <section id="tasksBox" class="box" hidden>
    <h2>タスク</h2>
    <ul id="tasks" class="list"></ul>
  </section>

  <form id="form">
    <div class="row">
      <textarea id="text" placeholder="内容" rows="3" required></textarea>
      <button type="button" id="mic" class="mic" aria-label="音声入力" hidden></button>
    </div>

    <div class="row">
      <button type="button" id="dateBtn" class="field"></button>
      <label class="switch"><span>繰り返し</span><input type="checkbox" id="repeat"></label>
    </div>
    <div id="quick" class="quick">
      <button type="button" data-min="5">5分後</button>
      <button type="button" data-min="10">10分後</button>
      <button type="button" data-min="30">30分後</button>
      <button type="button" data-min="60">1時間後</button>
    </div>

    <div id="rep" hidden>
      <div id="days" class="days"></div>
      <div class="seg">
        <label><input type="radio" name="mode" value="time" checked><span>時刻</span></label>
        <label><input type="radio" name="mode" value="interval"><span>時間おき</span></label>
      </div>
      <div id="modeInterval" class="row" hidden>
        <select id="every"></select>
        <input type="time" id="start" value="09:00">
        <span class="dash">–</span>
        <input type="time" id="end" value="21:00">
      </div>
    </div>

    <div id="clockBox">
      <svg id="clock" viewBox="0 0 200 200" aria-label="時計"></svg>
      <div class="ampm">
        <button type="button" id="am">午前</button>
        <div class="readout">
          <button type="button" id="rdH" aria-label="時を選ぶ"></button><span>:</span><button type="button" id="rdM" aria-label="分を選ぶ"></button>
        </div>
        <button type="button" id="pm">午後</button>
      </div>
    </div>

    <button type="submit" id="submit">登録</button>
  </form>

  <button type="button" id="openList" class="ghost">予約一覧</button>
</main>

<dialog id="calDlg">
  <div class="cal">
    <div class="calHead">
      <button type="button" id="calPrev" aria-label="前の月">‹</button>
      <b id="calTitle"></b>
      <button type="button" id="calNext" aria-label="次の月">›</button>
    </div>
    <div id="calWeek" class="calGrid calWeek"></div>
    <div id="calGrid" class="calGrid"></div>
  </div>
</dialog>

<dialog id="listDlg" class="full">
  <div class="fullIn">
    <h2>予約一覧</h2>
    <p id="listEmpty" class="empty" hidden>予約はありません</p>
    <ul id="list" class="list"></ul>
    <button type="button" id="closeList" class="sub">閉じる</button>
  </div>
</dialog>
<script src="/voice.js"></script>
<script src="/app.js"></script>
</body>
</html>
